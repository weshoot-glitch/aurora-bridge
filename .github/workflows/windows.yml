# Builds the Aurora Bridge Windows app.
# Like aurora-bridge-android, this workflow assumes aurora-bridge-desktop/ is
# pushed as its own repository root.
name: Build Windows app

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    # Least-privilege: release publishing needs contents write; nothing else.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # npm reliably crashes mid-install on these Windows runners ("Exit
      # handler never called", npm 10.8 and 10.9 alike), so install with pnpm
      # in hoisted mode (flat node_modules, the same layout npm produces).
      - name: Install dependencies (pnpm)
        shell: pwsh
        run: |
          npm install -g pnpm@9
          pnpm install --config.node-linker=hoisted
          if (-not (Test-Path "node_modules/.bin/tsc.cmd") -and -not (Test-Path "node_modules/.bin/tsc.CMD")) {
            Write-Error "install did not produce a complete node_modules"
            exit 1
          }
      - run: npm run typecheck
      - run: npm test
      # The camera relay needs ffmpeg at runtime; the binary is not committed.
      # Download a pinned win64 build and place ffmpeg.exe where
      # electron-builder's extraResources expects it (resources/ffmpeg/).
      - name: Bundle ffmpeg (pinned win64 build)
        shell: pwsh
        run: |
          $urls = @(
            "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip",
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          )
          $ok = $false
          foreach ($url in $urls) {
            try {
              Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip -MaximumRetryCount 3 -RetryIntervalSec 10
              $ok = $true; break
            } catch { Write-Warning "download failed: $url" }
          }
          if (-not $ok) { Write-Error "all ffmpeg download sources failed"; exit 1 }
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-tmp
          $exe = Get-ChildItem -Recurse ffmpeg-tmp -Filter ffmpeg.exe | Select-Object -First 1
          if (-not $exe) { Write-Error "ffmpeg.exe not found in downloaded archive"; exit 1 }
          Copy-Item $exe.FullName resources/ffmpeg/ffmpeg.exe
          & resources/ffmpeg/ffmpeg.exe -version
          if ($LASTEXITCODE -ne 0) { Write-Error "bundled ffmpeg failed to run"; exit 1 }
      # --publish never: the release step below publishes; electron-builder
      # must not try to publish on tag builds itself (it has no token).
      - run: npm run dist:win -- --publish never
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: aurora-bridge-windows
          path: release/*.exe
          if-no-files-found: error
      # Tag pushes (v1.2.3) publish a GitHub Release. Aurora's Downloads page
      # reads the latest release from the GitHub API — no manual file copying.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/AuroraBridgeSetup.exe
          generate_release_notes: true
