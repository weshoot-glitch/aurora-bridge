# Builds the Aurora Bridge Windows app.
# Like aurora-bridge-android, this workflow assumes aurora-bridge-desktop/ is
# pushed as its own repository root.
name: Build Windows app

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    # Least-privilege: release publishing needs contents write; nothing else.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # npm ci hits a known npm-on-Windows crash ("Exit handler never called");
      # npm install from the committed lockfile is the reliable path here.
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run dist:win
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: aurora-bridge-windows
          path: release/*.exe
          if-no-files-found: error
      # Tag pushes (v1.2.3) publish a GitHub Release. Aurora's Downloads page
      # reads the latest release from the GitHub API — no manual file copying.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/AuroraBridgeSetup.exe
          generate_release_notes: true
