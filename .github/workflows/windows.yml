# Builds the Aurora Bridge Windows app.
# Like aurora-bridge-android, this workflow assumes aurora-bridge-desktop/ is
# pushed as its own repository root.
name: Build Windows app

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    # Least-privilege: release publishing needs contents write; nothing else.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # npm 10.9.x crashes mid-install on Windows runners ("Exit handler never
      # called"); pin the previous stable npm before installing.
      - run: npm install -g npm@10.8.2
      # npm ci hits a known npm-on-Windows crash ("Exit handler never called");
      # npm install from the committed lockfile is the reliable path here.
      # npm on Windows runners intermittently dies mid-install ("Exit handler
      # never called") leaving node_modules incomplete but exiting 0. Retry
      # until the toolchain is actually present.
      - name: Install dependencies (with retry)
        shell: pwsh
        run: |
          for ($i = 1; $i -le 4; $i++) {
            npm install --no-audit --no-fund
            if (Test-Path "node_modules/.bin/tsc.cmd") { Write-Host "Install complete on attempt $i"; exit 0 }
            Write-Host "node_modules incomplete after attempt $i; retrying"
          }
          Write-Error "npm install never produced a complete node_modules"
          exit 1
      - run: npm run typecheck
      - run: npm test
      - run: npm run dist:win
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: aurora-bridge-windows
          path: release/*.exe
          if-no-files-found: error
      # Tag pushes (v1.2.3) publish a GitHub Release. Aurora's Downloads page
      # reads the latest release from the GitHub API — no manual file copying.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/AuroraBridgeSetup.exe
          generate_release_notes: true
